# Prompt / policy text rules (generic) — Isovane-authored.
# Composed at scan time with Semgrep Registry p/ai-best-practices (2A).
# Keep HITL / RAG patterns aligned with promptlint recall-first heuristics:
# never flag English verbs like "Write a briefing", and never treat {context} as RAG.
rules:
  - id: isovane.prompt.jailbreak-invite
    languages: [generic]
    severity: WARNING
    message: "Prompt invites role override / ignore-previous behavior (LLM01)."
    metadata:
      owasp: [LLM01]
      isovane_category: prompt
      isovane_title: "Jailbreak-inviting phrasing"
      isovane_fix_kind: prompt
      isovane_fix_summary: "Remove jailbreak invitations; add refusal boundaries."
    paths:
      include:
        - "*.md"
        - "*.txt"
        - "*.py"
        - "*prompt*"
        - "*system*"
        - "*SYSTEM*"
    pattern-either:
      - pattern-regex: (?i)ignore\s+previous
      - pattern-regex: (?i)\bjailbreak\b

  - id: isovane.prompt.rag-without-trust
    languages: [generic]
    severity: ERROR
    message: "Retrieved/RAG context is concatenated without an untrusted/trust boundary (LLM01/LLM08)."
    metadata:
      owasp: [LLM01, LLM08]
      isovane_category: prompt
      isovane_title: "RAG concat without trust boundary"
      isovane_fix_kind: prompt
      isovane_fix_summary: "Mark retrieved text as untrusted; forbid tools from RAG alone."
    paths:
      include:
        - "*.md"
        - "*.txt"
        - "*.py"
        - "*prompt*"
        - "*system*"
    patterns:
      - pattern-either:
          - pattern-regex: (?i)\b(rag|vector\s*(?:store|db|database|search)|knowledge\s*base|chroma|pinecone|faiss|docstore|similarity[_\s-]?search)\b
          - pattern-regex: (?i)retrieved\s+(?:document|doc|chunk|passage|excerpt)s?
          - pattern-regex: \{[^}]*\brag\b[^}]*\}
      - pattern-not-regex: (?i)\b(untrusted|trust\s+boundary|do\s+not\s+trust|BEGIN[_\s-]?UNTRUSTED)\b

  - id: isovane.prompt.missing-pii-bounds
    languages: [generic]
    severity: WARNING
    message: "System/prompt text lacks PII handling or disclosure limits (LLM02)."
    metadata:
      owasp: [LLM02]
      isovane_category: prompt
      isovane_title: "Missing PII / disclosure bounds"
      isovane_fix_kind: prompt
      isovane_fix_summary: "Add PII non-disclosure and redact-before-tool rules."
    paths:
      include:
        - "*.py"
        - "*prompt*"
        - "*system*"
        - "SYSTEM*"
    patterns:
      - pattern-regex: (?is)(you are |system\s*prompt|SystemMessage|system\s*=\s*["'])
      - pattern-not-regex: (?i)\b(pii|personal data|redact|do not (share|exfiltrate))\b

  - id: isovane.prompt.tools-without-hitl
    languages: [generic]
    severity: ERROR
    message: "Prompt mentions tools/search/actions but no human confirmation (LLM06/ASI09)."
    metadata:
      owasp: [LLM06, ASI09]
      isovane_category: agency
      isovane_title: "Tools mentioned without HITL"
      isovane_fix_kind: prompt
      isovane_fix_summary: "Require confirmation before send/pay/shell/search side-effects."
    paths:
      include:
        - "*.md"
        - "*.txt"
        - "*.py"
        - "*prompt*"
        - "*system*"
    patterns:
      - pattern-either:
          # Structural / wiring signals (same family as promptlint + AST)
          - pattern-regex: (?i)\b(bind_tools|create_react_agent|ToolNode|@tool|tools\s*=\s*\[)
          - pattern-regex: (?i)\b(send_email|pay_refund|run_shell|execute_command|duckduckgo_search)\b
          - pattern-regex: (?i)\bshell\s*=\s*True\b
          # Capability prose — not bare verbs like "Write a briefing" / re.search
          - pattern-regex: (?i)\byou (?:can|may|should|must|will)\b.{0,80}\b(send|email|pay|refund|shell|exec|transfer|delete|money|funds)\b
          - pattern-regex: (?i)\b(send|draft|compose|write)\s+(an?\s+)?emails?\b
          - pattern-regex: (?i)\b(issue|process|approve|execute|pay)\s+(a\s+|the\s+)?refunds?\b
          - pattern-regex: (?i)\brun\s+(shell|bash|commands?)\b
          - pattern-regex: (?i)\b(transfer|wire)\s+(money|funds|payments?)\b
          - pattern-regex: (?i)\b(call|invoke|use)\s+(the\s+)?(refund|payment|shell|email)\s+tool\b
          - pattern-regex: (?i)\b(refund|payment|shell|email)\s+tool\b
          - pattern-regex: (?i)\bconsequential tools?\b|\bside[- ]effects?\b
      - pattern-not-regex: (?i)\b(hitl|human-in-the-loop|human in the loop|confirm|approval)\b
      - pattern-not-regex: (?i)\bwrite\b.{0,40}\b(briefing|summary|bullet|title line)\b

  - id: isovane.prompt.system-disclosure
    languages: [generic]
    severity: INFO
    message: "Prompt may encourage revealing system instructions (LLM07)."
    metadata:
      owasp: [LLM07]
      isovane_category: prompt
      isovane_title: "System prompt self-disclosure risk"
      isovane_fix_kind: prompt
      isovane_fix_summary: "Forbid repeating system instructions verbatim."
    paths:
      include:
        - "*.py"
        - "*prompt*"
        - "*system*"
    patterns:
      - pattern-regex: (?i)you are
      - pattern-regex: (?i)system prompt
